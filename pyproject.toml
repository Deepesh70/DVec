[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dvec"
version = "0.1.0"
description = "Real-time low-latency Target Speaker Extraction daemon"
authors = [{ name = "DVec Engineering" }]
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
]

[project.scripts]
dvec-enroll = "dvec.enrollment.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
export = [
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]
enrollment = [
    "speechbrain>=1.0.0",
    "webrtcvad>=2.0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
